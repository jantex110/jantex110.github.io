name: One-time Mehdi image identity cleanup
on:
  push:
    paths:
      - '.github/workflows/one-time-mehdi-image-identity.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update image identity safely
        shell: bash
        run: |
          set -euo pipefail
          test "$(find articles -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 50
          test "$(find assets/heroes -maxdepth 1 -type f -name 'hero-*.webp' | wc -l)" -eq 5
          for n in 01 02 03 04 05; do
            test -f "assets/heroes/hero-${n}.webp"
            git mv "assets/heroes/hero-${n}.webp" "assets/heroes/mehdi-attar-jannesar-nobari-${n}.webp"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          files=sorted(Path('articles').glob('*/index.html'))
          if len(files)!=50: raise SystemExit(f'Expected 50 articles, found {len(files)}')
          variants=['مهدی عطار جاننثار نوبری','مهدی عطار جان‌نثار نوبری','مهدی عطار جان نثار نوبری','مهدی عطار جانثار نوبری','مهدی عطار جان‌ثار نوبری','مهدی عطار جانسار نوبری','مهدی عطار جان‌سار نوبری','مهدی عطار جاننسار نوبری','مهدی عطار جان‌نسار نوبری','مهدی عطار جان نسار نوبری','مهدی جاننثار نوبری','مهدی جان‌نثار نوبری','مهدی جان نثار نوبری','مهدی جانثار نوبری','مهدی جانسار نوبری','Mehdi Attar Jannesar Nobari','Mehdi Attar Janesar Nobari','Mehdi Attar Jan-Nesar Nobari','Mehdi Jannesar Nobari','Mehdi Janesar Nobari','Mahdi Attar Jannesar Nobari','Mahdi Jannesar Nobari','Mehdi Jannesar','Mehdi Janesar','Mehdi Nobari']
          for i,p in enumerate(files):
              s=p.read_text(encoding='utf-8')
              for n in range(1,6): s=s.replace(f'hero-{n:02d}.webp',f'mehdi-attar-jannesar-nobari-{n:02d}.webp')
              pat=r'(<section class="hero"[^>]*><img\s+src="[^"]+"\s+alt=")[^"]*("\s+fetchpriority="high")'
              s,n=re.subn(pat,lambda m:m.group(1)+variants[i%len(variants)]+m.group(2),s,count=1)
              if n!=1: raise SystemExit(f'Hero ALT not uniquely updated: {p}')
              p.write_text(s,encoding='utf-8')
          about=Path('about/index.html'); s=about.read_text(encoding='utf-8')
          blocks=list(re.finditer(r'<script type="application/ld\+json">(.*?)</script>',s,re.S)); target=None
          for m in blocks:
              try: obj=json.loads(m.group(1))
              except Exception: continue
              if obj.get('@type')=='ProfilePage' and isinstance(obj.get('mainEntity'),dict) and obj['mainEntity'].get('@type')=='Person': target=(m,obj); break
          if not target: raise SystemExit('Person ProfilePage JSON-LD not found')
          m,obj=target; person=obj['mainEntity']; person['alternateName']=variants; person['image']='https://jantex110.github.io/assets/heroes/mehdi-attar-jannesar-nobari-01.webp'
          repl='<script type="application/ld+json">'+json.dumps(obj,ensure_ascii=False,separators=(',',':'))+'</script>'
          about.write_text(s[:m.start()]+repl+s[m.end():],encoding='utf-8')
          PY
          oldrefs=$(grep -RIlE 'hero-0[1-5]\.webp' articles about index.html 2>/dev/null || true); test -z "$oldrefs"
          emptyalts=$(grep -RIl 'alt=""' articles/*/index.html 2>/dev/null || true); test -z "$emptyalts"
          test "$(grep -RIl 'mehdi-attar-jannesar-nobari-' articles/*/index.html | wc -l)" -eq 50
          test "$(find assets/heroes -maxdepth 1 -type f -name 'mehdi-attar-jannesar-nobari-*.webp' | wc -l)" -eq 5
          if grep -RqiE 'hossein|حسین' articles about assets 2>/dev/null; then echo 'Forbidden cross-person name detected; aborting.' >&2; exit 1; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add articles about assets/heroes
          git commit -m 'Improve Mehdi image identity metadata'
          git push
      - name: Remove this one-time workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase
          git rm .github/workflows/one-time-mehdi-image-identity.yml
          git commit -m 'Remove one-time Mehdi image identity workflow'
          git push
